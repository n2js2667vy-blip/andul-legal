<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Andül — Support &amp; Legal</title>
  <style>
    :root {
      --bg: #100c18;
      --card: #1a1424;
      --text: #f6f1e6;
      --muted: #b7ab9a;
      --gold: #e0c48a;
      --line: #3a2e22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #100c18 0%, #1c1428 100%);
      color: var(--text);
      padding: 48px 20px;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 28px; }
    .links { display: grid; gap: 12px; }
    a.card {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
    }
    a.card strong { display: block; font-size: 1.05rem; margin-bottom: 4px; color: var(--gold); }
    a.card span { display: block; color: var(--muted); font-size: 0.92rem; word-break: break-all; }
    .email { margin-top: 28px; color: var(--muted); font-size: 0.95rem; }
    .email a { color: var(--gold); }
  </style>
</head>
<body>
  <main>
    <h1>Andül</h1>
    <p class="sub">Support &amp; legal pages</p>
    <div class="links">
      <a class="card" href="https://n2js2667vy-blip.github.io/andul-legal/support.html">
        <strong>Support</strong>
        <span>https://n2js2667vy-blip.github.io/andul-legal/support.html</span>
      </a>
      <a class="card" href="https://n2js2667vy-blip.github.io/andul-legal/privacy.html">
        <strong>Privacy Policy</strong>
        <span>https://n2js2667vy-blip.github.io/andul-legal/privacy.html</span>
      </a>
      <a class="card" href="https://n2js2667vy-blip.github.io/andul-legal/terms.html">
        <strong>Terms of Use</strong>
        <span>https://n2js2667vy-blip.github.io/andul-legal/terms.html</span>
      </a>
    </div>
    <p class="email">
      Email:
      <a href="mailto:alperhalici.85@outlook.com">alperhalici.85@outlook.com</a>
    </p>
  </main>
</body>
</html>
